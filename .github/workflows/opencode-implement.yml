name: Roadmap Implement
run-name: "Implement: ${{ inputs.roadmap_path }}"

on:
  workflow_dispatch:
    inputs:
      roadmap_path:
        description: Path to the numbered roadmap work unit in this repository
        required: true
        type: string
      model:
        description: Optional provider/model override for implement mode
        required: false
        type: string

jobs:
  roadmap:
    name: Implement work unit
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      OPENCODE_CONFIG: ${{ github.workspace }}/opencode.json
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      OPENCODE_DISABLE_PRUNE: "1"
      OPENCODE_DISABLE_TERMINAL_TITLE: "1"
      OPENCODE_PERMISSION: '{"*":"allow"}'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate roadmap input
        id: roadmap
        shell: bash
        run: |
          set -euo pipefail

          roadmap_path="${{ inputs.roadmap_path }}"

          case "${roadmap_path}" in
            roadmap/[0-9][0-9][0-9]-*.md|*/roadmap/[0-9][0-9][0-9]-*.md) ;;
            *)
              echo "roadmap_path must point to a numbered roadmap work unit in this repository (for example roadmap/001-example.md or pilots/todo-app/roadmap/010-todo-app-example.md)" >&2
              exit 1
              ;;
          esac

          if [[ ! -f "${roadmap_path}" ]]; then
            echo "roadmap file not found: ${roadmap_path}" >&2
            exit 1
          fi

          status="$(sed -n '1,20p' "${roadmap_path}" | sed -n 's/^status: //p' | head -n 1)"

          case "${status}" in
            ready|active) ;;
            *)
              echo "roadmap file must be in ready or active status, found: ${status:-missing}" >&2
              exit 1
              ;;
          esac

          printf 'roadmap_path=%s\n' "${roadmap_path}" >> "${GITHUB_OUTPUT}"
          printf 'roadmap_status=%s\n' "${status}" >> "${GITHUB_OUTPUT}"

      - name: Resolve model
        id: model
        shell: bash
        run: |
          set -euo pipefail

          resolved_model="${{ inputs.model || 'zai-coding-plan/glm-5.1' }}"

          case "${resolved_model}" in
            opencode/*|zai-coding-plan/*) ;;
            *)
              echo "model must use an allowed provider prefix: opencode/<model-id> or zai-coding-plan/<model-id>" >&2
              exit 1
              ;;
          esac

          if [[ "${resolved_model}" == */ ]]; then
            echo "model must include a model id after the provider prefix" >&2
            exit 1
          fi

          printf 'model=%s\n' "${resolved_model}" >> "${GITHUB_OUTPUT}"

      - name: Resolve workflow artifact paths
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail

          printf 'commit_subject_path=%s/opencode-commit-subject.txt\n' "${RUNNER_TEMP}" >> "${GITHUB_OUTPUT}"
          printf 'commit_body_path=%s/opencode-commit-body.md\n' "${RUNNER_TEMP}" >> "${GITHUB_OUTPUT}"
          printf 'pr_number_path=%s/opencode-pr-number.txt\n' "${RUNNER_TEMP}" >> "${GITHUB_OUTPUT}"
          printf 'pr_head_ref_path=%s/opencode-pr-head-ref.txt\n' "${RUNNER_TEMP}" >> "${GITHUB_OUTPUT}"
          printf 'pr_title_path=%s/opencode-pr-title.txt\n' "${RUNNER_TEMP}" >> "${GITHUB_OUTPUT}"
          printf 'pr_body_path=%s/opencode-pr-body.md\n' "${RUNNER_TEMP}" >> "${GITHUB_OUTPUT}"

      - name: Resolve evidence paths
        id: evidence_paths
        shell: bash
        run: |
          set -euo pipefail

          roadmap_path="${{ steps.roadmap.outputs.roadmap_path }}"
          roadmap_dir="$(dirname "${roadmap_path}")"
          work_unit_slug="$(basename "${roadmap_path}" .md)"

          if [[ "${roadmap_dir}" == "roadmap" ]]; then
            evidence_dir="docs/evidence/${work_unit_slug}"
          else
            evidence_dir="${roadmap_dir%/roadmap}/docs/evidence/${work_unit_slug}"
          fi

          printf 'dir=%s\n' "${evidence_dir}" >> "${GITHUB_OUTPUT}"
          printf 'before_path=%s/before-main-screen.png\n' "${evidence_dir}" >> "${GITHUB_OUTPUT}"
          printf 'after_path=%s/after-main-screen.png\n' "${evidence_dir}" >> "${GITHUB_OUTPUT}"

      - name: Resolve git identity
        id: git_identity
        shell: bash
        run: |
          set -euo pipefail

          printf 'author_name=%s\n' 'Agent Blueprint Implementer' >> "${GITHUB_OUTPUT}"
          printf 'author_email=%s\n' 'agent-blueprint-implementer@users.noreply.github.com' >> "${GITHUB_OUTPUT}"

      - name: Resolve model attribution
        id: attribution
        shell: bash
        run: |
          set -euo pipefail

          model_route="${{ steps.model.outputs.model }}"
          provider_id="${model_route%%/*}"
          model_id="${model_route#*/}"
          model_lower="$(printf '%s' "${model_id}" | tr '[:upper:]' '[:lower:]')"

          coauthor_name="AI Agent"
          coauthor_email="noreply@users.noreply.github.com"

          case "${model_lower}" in
            *glm*)
              coauthor_name="GLM"
              coauthor_email="zai-org@users.noreply.github.com"
              ;;
            *gemini*)
              coauthor_name="Gemini"
              coauthor_email="google-gemini@users.noreply.github.com"
              ;;
            *claude*)
              coauthor_name="Claude"
              coauthor_email="claude@users.noreply.github.com"
              ;;
            *gpt*|*codex*)
              coauthor_name="Codex"
              coauthor_email="codex@users.noreply.github.com"
              ;;
          esac

          case "${provider_id}" in
            zai-coding-plan) provider_label="Zhipu" ;;
            opencode) provider_label="OpenCode Zen" ;;
            *) provider_label="${provider_id}" ;;
          esac

          printf 'coauthor_name=%s\n' "${coauthor_name}" >> "${GITHUB_OUTPUT}"
          printf 'coauthor_email=%s\n' "${coauthor_email}" >> "${GITHUB_OUTPUT}"
          printf 'provider_label=%s\n' "${provider_label}" >> "${GITHUB_OUTPUT}"
          printf 'product_label=%s\n' 'opencode' >> "${GITHUB_OUTPUT}"
          printf 'model_label=%s\n' "${model_id}" >> "${GITHUB_OUTPUT}"

      - name: Prepare OpenCode runtime
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/opencode/data"
          export XDG_STATE_HOME="${RUNNER_TEMP}/opencode/state"
          export XDG_CACHE_HOME="${RUNNER_TEMP}/opencode/cache"
          mkdir -p "${XDG_DATA_HOME}" "${XDG_STATE_HOME}" "${XDG_CACHE_HOME}"
          {
            printf 'XDG_DATA_HOME=%s\n' "${XDG_DATA_HOME}"
            printf 'XDG_STATE_HOME=%s\n' "${XDG_STATE_HOME}"
            printf 'XDG_CACHE_HOME=%s\n' "${XDG_CACHE_HOME}"
          } >> "${GITHUB_ENV}"

      - name: Install OpenCode CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "${HOME}/.opencode/bin" >> "${GITHUB_PATH}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Prepare implement branch
        id: implement_branch
        shell: bash
        run: |
          set -euo pipefail

          roadmap_file="${{ steps.roadmap.outputs.roadmap_path }}"
          branch_slug="${roadmap_file#roadmap/}"
          branch_slug="${branch_slug%.md}"
          branch_slug="${branch_slug#*-}"
          branch_name="opencode/${branch_slug}-${GITHUB_RUN_ID}"
          start_sha="$(git rev-parse HEAD)"
          base_ref="${GITHUB_REF_NAME}"

          git checkout -b "${branch_name}"

          printf 'branch_name=%s\n' "${branch_name}" >> "${GITHUB_OUTPUT}"
          printf 'base_ref=%s\n' "${base_ref}" >> "${GITHUB_OUTPUT}"
          printf 'start_sha=%s\n' "${start_sha}" >> "${GITHUB_OUTPUT}"

      - name: Run OpenCode implement
        id: opencode_implement
        env:
          ZAI_CODING_PLAN_API_KEY: ${{ secrets.ZAI_CODING_PLAN_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GIT_AUTHOR_NAME: ${{ steps.git_identity.outputs.author_name }}
          GIT_AUTHOR_EMAIL: ${{ steps.git_identity.outputs.author_email }}
          GIT_COMMITTER_NAME: ${{ steps.git_identity.outputs.author_name }}
          GIT_COMMITTER_EMAIL: ${{ steps.git_identity.outputs.author_email }}
        shell: bash
        run: |
          set -euo pipefail

          prompt="$(cat <<EOF
          \`implement\` mode for roadmap work unit \`${{ steps.roadmap.outputs.roadmap_path }}\`.

          Shared execution contract:
          - Treat that roadmap file as the canonical source of scope.
          - Read \`AGENTS.md\` and the roadmap file before making changes.
          - Apply the \`Runtime: Autonomous GitHub Actions\` policy in \`AGENTS.md\`.
          - Run the repository validation commands listed in \`AGENTS.md\` before finishing.
          - If you change files under \`pilots/todo-app/\`, also run \`bun run typecheck\`, \`bun run test\`, and \`bun run build\` from that directory before finishing.
          - Reference the roadmap path \`${{ steps.roadmap.outputs.roadmap_path }}\` in the final commit message or PR body.
          - Stay on the current branch \`${{ steps.implement_branch.outputs.branch_name }}\`; do not create or switch branches.
          - Do not run \`gh\`, do not push, do not open pull requests, and do not dispatch downstream workflows.
          - Do not create commits. Leave file changes in the working tree and let the workflow stage and commit them.
          - Do not run \`npm install\` or generate \`package-lock.json\` in this repository. Use Bun-based commands only.
          - If a required tool appears missing, stop and report that explicitly instead of switching package managers or generating new lockfiles.
          - You may optionally write the commit subject to \`${{ steps.artifacts.outputs.commit_subject_path }}\`.
          - You may optionally write the commit body markdown to \`${{ steps.artifacts.outputs.commit_body_path }}\`.
          - After the implementation is complete, write the PR title to \`${{ steps.artifacts.outputs.pr_title_path }}\`.
          - After the implementation is complete, write the PR body markdown to \`${{ steps.artifacts.outputs.pr_body_path }}\`.
          - Keep the PR body concise and reviewer-first with this section order:
            1. \`Roadmap: <path>\` near the top
            2. \`## Summary\`
            3. \`## Evidence\` when screenshots or other proof artifacts exist
            4. \`## Test Coverage\`
            5. \`## Validation\`
          - In \`Test Coverage\`, summarize new or updated automated tests in plain language. Do not rely on file paths alone when you know what the tests prove.
          - In \`Validation\`, keep the content short and easy to scan.
          - Stop after the file changes and PR metadata files are written.
          EOF
          )"

          set +e
          timeout --signal=TERM 25m opencode run \
            --model "${{ steps.model.outputs.model }}" \
            --agent build \
            -f "${{ steps.roadmap.outputs.roadmap_path }}" \
            -f AGENTS.md \
            -- \
            "${prompt}"
          status=$?
          set -e

          if [[ "${status}" -eq 124 ]]; then
            echo "OpenCode implement exceeded the 25 minute timeout" >&2
            exit 124
          fi

          exit "${status}"

      - name: Capture pilot screenshot evidence
        id: capture_pilot_screenshot
        shell: bash
        run: |
          set -euo pipefail

          base_ref="${{ steps.implement_branch.outputs.base_ref }}"
          if ! git diff --name-only "origin/${base_ref}...HEAD" | grep -q '^pilots/todo-app/'; then
            printf 'captured=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          current_workspace="${GITHUB_WORKSPACE}"
          before_path="${{ steps.evidence_paths.outputs.before_path }}"
          after_path="${{ steps.evidence_paths.outputs.after_path }}"
          base_worktree="${RUNNER_TEMP}/todo-app-base-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base_runtime="${RUNNER_TEMP}/todo-app-base-runtime"

          cleanup() {
            git worktree remove --force "${base_worktree}" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          mkdir -p "${current_workspace}/$(dirname "${before_path}")" "${current_workspace}/$(dirname "${after_path}")" "${base_runtime}"

          (
            cd "${current_workspace}/pilots/todo-app"
            bun install
          )
          bash "${current_workspace}/capture-todo-app-screenshot.sh" "${current_workspace}/${after_path}"

          git worktree add --detach "${base_worktree}" "origin/${base_ref}"
          (
            cd "${base_worktree}/pilots/todo-app"
            bun install
          )
          GITHUB_WORKSPACE="${base_worktree}" RUNNER_TEMP="${base_runtime}" \
            bash "${base_worktree}/capture-todo-app-screenshot.sh" "${current_workspace}/${before_path}"

          printf 'captured=true\n' >> "${GITHUB_OUTPUT}"
          printf 'before_path=%s\n' "${before_path}" >> "${GITHUB_OUTPUT}"
          printf 'after_path=%s\n' "${after_path}" >> "${GITHUB_OUTPUT}"

      - name: Finalize implement commit
        id: finalize_commit
        if: ${{ steps.opencode_implement.outcome == 'success' }}
        env:
          GIT_AUTHOR_NAME: ${{ steps.git_identity.outputs.author_name }}
          GIT_AUTHOR_EMAIL: ${{ steps.git_identity.outputs.author_email }}
          GIT_COMMITTER_NAME: ${{ steps.git_identity.outputs.author_name }}
          GIT_COMMITTER_EMAIL: ${{ steps.git_identity.outputs.author_email }}
        shell: bash
        run: |
          set -euo pipefail

          start_sha="${{ steps.implement_branch.outputs.start_sha }}"
          current_sha="$(git rev-parse HEAD)"

          if [[ "${current_sha}" != "${start_sha}" ]]; then
            if [[ -n "$(git status --short)" ]]; then
              echo "agent left additional uncommitted changes after creating a commit" >&2
              exit 1
            fi

            printf 'commit_sha=%s\n' "${current_sha}" >> "${GITHUB_OUTPUT}"
            printf 'changes_present=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ -z "$(git status --short)" ]]; then
            printf 'changes_present=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          commit_subject_path="${{ steps.artifacts.outputs.commit_subject_path }}"
          commit_body_path="${{ steps.artifacts.outputs.commit_body_path }}"
          commit_subject="Apply ${{ steps.roadmap.outputs.roadmap_path }}"

          if [[ -s "${commit_subject_path}" ]]; then
            commit_subject="$(head -n 1 "${commit_subject_path}" | tr -d '\r')"
          fi

          if [[ -z "${commit_subject}" ]]; then
            echo "commit subject must not be empty" >&2
            exit 1
          fi

          git add -A
          commit_args=(-m "${commit_subject}")

          if [[ -s "${commit_body_path}" ]]; then
            commit_body="$(cat "${commit_body_path}")"
            commit_args+=(-m "${commit_body}")
          fi

          commit_args+=(
            -m "Co-authored-by: ${{ steps.attribution.outputs.coauthor_name }} <${{ steps.attribution.outputs.coauthor_email }}>"
            -m "AI-Provider: ${{ steps.attribution.outputs.provider_label }}"
            -m "AI-Product: ${{ steps.attribution.outputs.product_label }}"
            -m "AI-Model: ${{ steps.attribution.outputs.model_label }}"
          )

          git commit "${commit_args[@]}"

          printf 'commit_sha=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          printf 'changes_present=true\n' >> "${GITHUB_OUTPUT}"

      - name: Push implement branch
        id: push_branch
        if: ${{ steps.finalize_commit.outputs.changes_present == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          branch_name="${{ steps.implement_branch.outputs.branch_name }}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -u origin "${branch_name}"
          printf 'head_sha=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Prepare implement PR metadata
        id: prepare_pr_metadata
        if: ${{ steps.finalize_commit.outputs.changes_present == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          pr_title_path="${{ steps.artifacts.outputs.pr_title_path }}"
          pr_body_path="${{ steps.artifacts.outputs.pr_body_path }}"
          changed_files_path="${RUNNER_TEMP}/opencode-changed-files.txt"
          roadmap_path="${{ steps.roadmap.outputs.roadmap_path }}"
          base_ref="${{ steps.implement_branch.outputs.base_ref }}"
          repo_name="${GITHUB_REPOSITORY}"
          head_sha="${{ steps.push_branch.outputs.head_sha }}"
          screenshot_captured="${{ steps.capture_pilot_screenshot.outputs.captured || 'false' }}"
          evidence_dir="${{ steps.evidence_paths.outputs.dir }}"
          before_screenshot_path="${{ steps.capture_pilot_screenshot.outputs.before_path }}"
          after_screenshot_path="${{ steps.capture_pilot_screenshot.outputs.after_path }}"

          git diff --name-only "origin/${base_ref}...HEAD" > "${changed_files_path}"

          python3 - "${pr_title_path}" "${pr_body_path}" "${changed_files_path}" "${roadmap_path}" "${repo_name}" "${head_sha}" "${screenshot_captured}" "${evidence_dir}" "${before_screenshot_path}" "${after_screenshot_path}" <<'PY'
          import pathlib
          import re
          import sys

          title_path = pathlib.Path(sys.argv[1])
          body_path = pathlib.Path(sys.argv[2])
          changed_files_path = pathlib.Path(sys.argv[3])
          roadmap_path = sys.argv[4]
          repository = sys.argv[5]
          head_sha = sys.argv[6]
          screenshot_captured = sys.argv[7].lower() == "true"
          evidence_dir = sys.argv[8]
          before_screenshot_path = sys.argv[9]
          after_screenshot_path = sys.argv[10]

          def read_text(path: pathlib.Path) -> str:
              if not path.exists():
                  return ""
              return path.read_text(encoding="utf-8").replace("\r\n", "\n").strip()

          title = read_text(title_path)
          if not title:
              title = f"Apply {roadmap_path}"
          title_path.write_text(title.splitlines()[0].strip() + "\n", encoding="utf-8")

          raw_body = read_text(body_path)
          body_lines = [
              line
              for line in raw_body.splitlines()
              if not re.match(r"^Roadmap:\s*`?.+`?\s*$", line.strip())
          ]
          normalized_body = "\n".join(body_lines).strip()

          sections = []
          preamble = []
          current = None

          for line in normalized_body.splitlines():
              match = re.match(r"^##\s+(.+?)\s*$", line)
              if match:
                  current = {"heading": match.group(1).strip(), "lines": []}
                  sections.append(current)
                  continue

              if current is None:
                  preamble.append(line)
              else:
                  current["lines"].append(line)

          def normalize_heading(value: str) -> str:
              return re.sub(r"\s+", " ", value.strip().lower())

          standard_sections = {}
          extra_sections = []

          for section in sections:
              heading = section["heading"]
              normalized = normalize_heading(heading)
              content = "\n".join(section["lines"]).strip()

              if normalized in {"summary", "evidence", "test coverage", "validation"} and normalized not in standard_sections:
                  standard_sections[normalized] = content
              else:
                  extra_sections.append((heading, content))

          preamble_text = "\n".join(preamble).strip()
          if preamble_text:
              summary_content = standard_sections.get("summary", "").strip()
              standard_sections["summary"] = (
                  f"{preamble_text}\n\n{summary_content}".strip()
                  if summary_content
                  else preamble_text
              )

          if not standard_sections.get("summary"):
              standard_sections["summary"] = f"- Apply the scoped roadmap work unit `{roadmap_path}`."

          changed_files = [
              line.strip()
              for line in read_text(changed_files_path).splitlines()
              if line.strip()
          ]
          test_files = [
              path
              for path in changed_files
              if "/tests/" in path or ".test." in path or ".spec." in path
          ]

          if not standard_sections.get("test coverage"):
              if test_files:
                  coverage_lines = []
                  for path in test_files:
                      if "/e2e/" in path or ".spec." in path:
                          coverage_lines.append(f"- End-to-end coverage changed in `{path}`.")
                      else:
                          coverage_lines.append(f"- Automated test coverage changed in `{path}`.")
                  standard_sections["test coverage"] = "\n".join(coverage_lines)
              else:
                  standard_sections["test coverage"] = "- No new automated tests were added in this workflow run."

          if not standard_sections.get("validation"):
              validation_lines = [
                  "- Fast `AGENTS.md` validation runs in the agent stage before the PR is updated.",
                  "- Attached PR checks are dispatched immediately after branch push.",
              ]
              if any(path.startswith("pilots/todo-app/") for path in changed_files):
                  validation_lines.insert(
                      0,
                      "- Pilot app changes should include `bun run typecheck`, `bun run test`, and `bun run build` from `pilots/todo-app`.",
                  )
              standard_sections["validation"] = "\n".join(validation_lines)

          if screenshot_captured and after_screenshot_path and not standard_sections.get("evidence"):
              evidence_lines = [
                  f"- Canonical evidence directory: `{evidence_dir}`",
              ]
              if before_screenshot_path:
                  before_url = f"https://github.com/{repository}/blob/{head_sha}/{before_screenshot_path}?raw=1"
                  evidence_lines.extend(
                      [
                          "",
                          "Before (base branch):",
                          "",
                          f"![Before screenshot]({before_url})",
                      ]
                  )
              after_url = f"https://github.com/{repository}/blob/{head_sha}/{after_screenshot_path}?raw=1"
              evidence_lines.extend(
                  [
                      "",
                      "After (PR branch):",
                      "",
                      f"![After screenshot]({after_url})",
                      "",
                      "Bot-generated Playwright captures are stored under the roadmap-scoped evidence directory.",
                  ]
              )
              standard_sections["evidence"] = "\n".join(evidence_lines)

          ordered_sections = [
              ("Summary", standard_sections.get("summary", "").strip()),
              ("Evidence", standard_sections.get("evidence", "").strip()),
              ("Test Coverage", standard_sections.get("test coverage", "").strip()),
              ("Validation", standard_sections.get("validation", "").strip()),
          ]

          output_lines = [f"Roadmap: `{roadmap_path}`", ""]

          for heading, content in ordered_sections:
              if heading == "Evidence" and not content:
                  continue
              output_lines.extend([f"## {heading}", "", content or "None.", ""])

          for heading, content in extra_sections:
              output_lines.extend([f"## {heading}", "", content or "None.", ""])

          body_path.write_text("\n".join(output_lines).rstrip() + "\n", encoding="utf-8")
          PY

      - name: Create implement PR
        id: create_pr
        if: ${{ steps.finalize_commit.outputs.changes_present == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          pr_title_path="${{ steps.artifacts.outputs.pr_title_path }}"
          pr_body_path="${{ steps.artifacts.outputs.pr_body_path }}"

          if [[ ! -s "${pr_title_path}" ]]; then
            printf 'Apply %s\n' "${{ steps.roadmap.outputs.roadmap_path }}" > "${pr_title_path}"
          fi

          if [[ ! -s "${pr_body_path}" ]]; then
            cat > "${pr_body_path}" <<EOF
          Roadmap: `${{ steps.roadmap.outputs.roadmap_path }}`

          ## Summary

          - Apply the scoped roadmap work unit `${{ steps.roadmap.outputs.roadmap_path }}`.

          ## Test Coverage

          - No new automated tests were added in this workflow run.

          ## Validation

          - Fast `AGENTS.md` validation runs in the agent stage before the PR is updated.
          - Attached PR checks are dispatched immediately after branch push.
          EOF
          fi

          pr_url="$(gh pr create \
            --base "${{ steps.implement_branch.outputs.base_ref }}" \
            --head "${{ steps.implement_branch.outputs.branch_name }}" \
            --title "$(head -n 1 "${pr_title_path}")" \
            --body-file "${pr_body_path}")"
          pr_number="$(printf '%s' "${pr_url}" | sed -E 's#.*/pull/([0-9]+)$#\1#')"

          printf '%s\n' "${pr_number}" > "${{ steps.artifacts.outputs.pr_number_path }}"
          printf '%s\n' "${{ steps.implement_branch.outputs.branch_name }}" > "${{ steps.artifacts.outputs.pr_head_ref_path }}"
          printf 'pr_number=%s\n' "${pr_number}" >> "${GITHUB_OUTPUT}"
          printf 'pr_url=%s\n' "${pr_url}" >> "${GITHUB_OUTPUT}"

      - name: Ensure workflow labels
        if: ${{ steps.create_pr.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          ensure_label() {
            local name="$1"
            local color="$2"
            local description="$3"
            gh label create "${name}" --color "${color}" --description "${description}" >/dev/null 2>&1 || true
          }

          ensure_label "workflow-owned" "1d76db" "PR created by roadmap automation"
          ensure_label "autofix-enabled" "0e8a16" "Automatic fix orchestration is enabled"
          ensure_label "autofix-disabled" "d73a4a" "Automatic fix orchestration is disabled"
          ensure_label "human-needed" "fbca04" "Workflow stopped and needs human intervention"

          gh pr edit "${{ steps.create_pr.outputs.pr_number }}" \
            --add-label "workflow-owned" \
            --add-label "autofix-enabled"

      - name: Publish screenshot evidence comment
        if: ${{ steps.create_pr.outcome == 'success' && steps.capture_pilot_screenshot.outputs.captured == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="$(tr -d '[:space:]' < "${{ steps.artifacts.outputs.pr_number_path }}")"
          comment_path="${RUNNER_TEMP}/opencode-screenshot-comment.md"

          cat > "${comment_path}" <<EOF
          ## Screenshot Evidence

          Canonical screenshot evidence for \`${{ steps.roadmap.outputs.roadmap_path }}\` is stored in the PR body \`Evidence\` section.

          Artifacts:

          - \`${{ steps.capture_pilot_screenshot.outputs.before_path }}\`
          - \`${{ steps.capture_pilot_screenshot.outputs.after_path }}\`

          _Attribution: ${{ steps.attribution.outputs.provider_label }} / ${{ steps.attribution.outputs.product_label }} / ${{ steps.attribution.outputs.model_label }}_
          <!-- ai-attribution provider="${{ steps.attribution.outputs.provider_label }}" product="${{ steps.attribution.outputs.product_label }}" model="${{ steps.attribution.outputs.model_label }}" -->
          EOF

          gh pr comment "${pr_number}" --body-file "${comment_path}"

      - name: Dispatch PR validation
        id: dispatch_validation
        if: ${{ steps.create_pr.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="$(tr -d '[:space:]' < "${{ steps.artifacts.outputs.pr_number_path }}")"
          pr_head_ref="$(tr -d '[:space:]' < "${{ steps.artifacts.outputs.pr_head_ref_path }}")"
          pr_head_sha="${{ steps.push_branch.outputs.head_sha }}"

          gh workflow run pr-validation.yml \
            -f pr_number="${pr_number}" \
            -f pr_head_ref="${pr_head_ref}" \
            -f pr_head_sha="${pr_head_sha}"

          printf 'dispatched=true\n' >> "${GITHUB_OUTPUT}"
          printf 'pr_number=%s\n' "${pr_number}" >> "${GITHUB_OUTPUT}"
          printf 'pr_head_ref=%s\n' "${pr_head_ref}" >> "${GITHUB_OUTPUT}"
          printf 'pr_head_sha=%s\n' "${pr_head_sha}" >> "${GITHUB_OUTPUT}"

      - name: Publish implement stage comment
        if: ${{ steps.create_pr.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="${{ steps.create_pr.outputs.pr_number }}"
          comment_path="${RUNNER_TEMP}/opencode-implement-stage-comment.md"
          evidence_dir="${{ steps.evidence_paths.outputs.dir }}"

          cat > "${comment_path}" <<EOF
          ## Implement Stage

          Created workflow-owned PR for \`${{ steps.roadmap.outputs.roadmap_path }}\`.

          - Validation dispatched: \`${{ steps.dispatch_validation.outcome || 'n/a' }}\`
          - Labels applied: \`workflow-owned\`, \`autofix-enabled\`
          - Canonical evidence directory: \`${evidence_dir}\`

          _Attribution: ${{ steps.attribution.outputs.provider_label }} / ${{ steps.attribution.outputs.product_label }} / ${{ steps.attribution.outputs.model_label }}_
          <!-- workflow-stage: implement; run_id: ${GITHUB_RUN_ID}; pr: ${pr_number}; roadmap: ${{ steps.roadmap.outputs.roadmap_path }} -->
          <!-- ai-attribution provider="${{ steps.attribution.outputs.provider_label }}" product="${{ steps.attribution.outputs.product_label }}" model="${{ steps.attribution.outputs.model_label }}" -->
          EOF

          gh pr comment "${pr_number}" --body-file "${comment_path}"

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## OpenCode Implement"
            echo
            echo "- Roadmap path: \`${{ steps.roadmap.outputs.roadmap_path }}\`"
            echo "- Roadmap status: \`${{ steps.roadmap.outputs.roadmap_status }}\`"
            echo "- Resolved model: \`${{ steps.model.outputs.model }}\`"
            echo "- Git commit identity: \`${{ steps.git_identity.outputs.author_name }} <${{ steps.git_identity.outputs.author_email }}>\`"
            echo "- OpenCode implement outcome: \`${{ steps.opencode_implement.outcome || 'n/a' }}\`"
            echo "- Created PR: \`#${{ steps.create_pr.outputs.pr_number || 'n/a' }}\`"
            echo "- Validation dispatch outcome: \`${{ steps.dispatch_validation.outcome || 'n/a' }}\`"
            echo "- Validation dispatch target: \`PR #${{ steps.dispatch_validation.outputs.pr_number || 'n/a' }} / ${{ steps.dispatch_validation.outputs.pr_head_ref || 'n/a' }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
