name: Roadmap Review
run-name: "Review: PR #${{ inputs.pr_number }} / ${{ inputs.roadmap_path }}"

on:
  workflow_dispatch:
    inputs:
      roadmap_path:
        description: Path to the numbered roadmap work unit in this repository
        required: true
        type: string
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      model:
        description: Optional provider/model override for review mode
        required: false
        type: string

jobs:
  roadmap:
    name: Review pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      OPENCODE_CONFIG: ${{ github.workspace }}/opencode.json
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      OPENCODE_DISABLE_PRUNE: "1"
      OPENCODE_DISABLE_TERMINAL_TITLE: "1"
      OPENCODE_PERMISSION: '{"*":"allow"}'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate roadmap input
        id: roadmap
        shell: bash
        run: |
          set -euo pipefail

          roadmap_path="${{ inputs.roadmap_path }}"

          case "${roadmap_path}" in
            roadmap/[0-9][0-9][0-9]-*.md|*/roadmap/[0-9][0-9][0-9]-*.md) ;;
            *)
              echo "roadmap_path must point to a numbered roadmap work unit in this repository (for example roadmap/001-example.md or pilots/todo-app/roadmap/010-todo-app-example.md)" >&2
              exit 1
              ;;
          esac

          if [[ ! -f "${roadmap_path}" ]]; then
            echo "roadmap file not found: ${roadmap_path}" >&2
            exit 1
          fi

          status="$(sed -n '1,20p' "${roadmap_path}" | sed -n 's/^status: //p' | head -n 1)"

          case "${status}" in
            ready|active) ;;
            *)
              echo "roadmap file must be in ready or active status, found: ${status:-missing}" >&2
              exit 1
              ;;
          esac

          printf 'roadmap_path=%s\n' "${roadmap_path}" >> "${GITHUB_OUTPUT}"
          printf 'roadmap_status=%s\n' "${status}" >> "${GITHUB_OUTPUT}"

      - name: Resolve model
        id: model
        shell: bash
        run: |
          set -euo pipefail

          resolved_model="${{ inputs.model || 'opencode/gpt-5.4' }}"

          case "${resolved_model}" in
            opencode/*|zai-coding-plan/*) ;;
            *)
              echo "model must use an allowed provider prefix: opencode/<model-id> or zai-coding-plan/<model-id>" >&2
              exit 1
              ;;
          esac

          if [[ "${resolved_model}" == */ ]]; then
            echo "model must include a model id after the provider prefix" >&2
            exit 1
          fi

          printf 'model=%s\n' "${resolved_model}" >> "${GITHUB_OUTPUT}"
          printf 'target_ref=PR #%s\n' "${{ inputs.pr_number }}" >> "${GITHUB_OUTPUT}"

      - name: Resolve workflow artifact paths
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail

          printf 'body_path=%s/opencode-review.md\n' "${RUNNER_TEMP}" >> "${GITHUB_OUTPUT}"
          printf 'decision_path=%s/opencode-review-decision.txt\n' "${RUNNER_TEMP}" >> "${GITHUB_OUTPUT}"
          printf 'review_context_path=%s/opencode-review-context.md\n' "${RUNNER_TEMP}" >> "${GITHUB_OUTPUT}"
          printf 'diff_path=%s/opencode-pr.diff\n' "${RUNNER_TEMP}" >> "${GITHUB_OUTPUT}"

      - name: Resolve git identity
        id: git_identity
        shell: bash
        run: |
          set -euo pipefail

          printf 'author_name=%s\n' 'Agent Blueprint Reviewer' >> "${GITHUB_OUTPUT}"
          printf 'author_email=%s\n' 'agent-blueprint-reviewer@users.noreply.github.com' >> "${GITHUB_OUTPUT}"

      - name: Resolve model attribution
        id: attribution
        shell: bash
        run: |
          set -euo pipefail

          model_route="${{ steps.model.outputs.model }}"
          provider_id="${model_route%%/*}"
          model_id="${model_route#*/}"
          model_lower="$(printf '%s' "${model_id}" | tr '[:upper:]' '[:lower:]')"

          coauthor_name="AI Agent"
          coauthor_email="noreply@users.noreply.github.com"

          case "${model_lower}" in
            *glm*)
              coauthor_name="GLM"
              coauthor_email="zai-org@users.noreply.github.com"
              ;;
            *gemini*)
              coauthor_name="Gemini"
              coauthor_email="google-gemini@users.noreply.github.com"
              ;;
            *claude*)
              coauthor_name="Claude"
              coauthor_email="claude@users.noreply.github.com"
              ;;
            *gpt*|*codex*)
              coauthor_name="Codex"
              coauthor_email="codex@users.noreply.github.com"
              ;;
          esac

          case "${provider_id}" in
            zai-coding-plan) provider_label="Zhipu" ;;
            opencode) provider_label="OpenCode Zen" ;;
            *) provider_label="${provider_id}" ;;
          esac

          printf 'coauthor_name=%s\n' "${coauthor_name}" >> "${GITHUB_OUTPUT}"
          printf 'coauthor_email=%s\n' "${coauthor_email}" >> "${GITHUB_OUTPUT}"
          printf 'provider_label=%s\n' "${provider_label}" >> "${GITHUB_OUTPUT}"
          printf 'product_label=%s\n' 'opencode' >> "${GITHUB_OUTPUT}"
          printf 'model_label=%s\n' "${model_id}" >> "${GITHUB_OUTPUT}"

      - name: Prepare OpenCode runtime
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/opencode/data"
          export XDG_STATE_HOME="${RUNNER_TEMP}/opencode/state"
          export XDG_CACHE_HOME="${RUNNER_TEMP}/opencode/cache"
          mkdir -p "${XDG_DATA_HOME}" "${XDG_STATE_HOME}" "${XDG_CACHE_HOME}"
          {
            printf 'XDG_DATA_HOME=%s\n' "${XDG_DATA_HOME}"
            printf 'XDG_STATE_HOME=%s\n' "${XDG_STATE_HOME}"
            printf 'XDG_CACHE_HOME=%s\n' "${XDG_CACHE_HOME}"
          } >> "${GITHUB_ENV}"

      - name: Install OpenCode CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "${HOME}/.opencode/bin" >> "${GITHUB_PATH}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Prepare review target
        id: review_target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="${{ inputs.pr_number }}"
          pr_json="$(gh pr view "${pr_number}" --json number,headRefName,baseRefName,url,title,body,reviewDecision,statusCheckRollup)"
          issue_comments_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments")"
          head_ref="$(printf '%s' "${pr_json}" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data["headRefName"])')"
          base_ref="$(printf '%s' "${pr_json}" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data["baseRefName"])')"

          git fetch origin "${base_ref}" "${head_ref}"
          git checkout -B "${head_ref}" "origin/${head_ref}"
          git diff --no-color "origin/${base_ref}...HEAD" > "${{ steps.artifacts.outputs.diff_path }}"

          PR_JSON="${pr_json}" ISSUE_COMMENTS_JSON="${issue_comments_json}" python3 - "${{ steps.artifacts.outputs.review_context_path }}" <<'PY'
          import json
          import os
          import sys

          output_path = sys.argv[1]
          data = json.loads(os.environ["PR_JSON"])
          issue_comments = json.loads(os.environ["ISSUE_COMMENTS_JSON"])

          lines = [
              "# Review Context",
              f"- PR: #{data['number']} {data['title']}",
              f"- URL: {data['url']}",
              f"- Base branch: {data['baseRefName']}",
              f"- Head branch: {data['headRefName']}",
              f"- Existing review decision: {data.get('reviewDecision') or 'none'}",
          ]

          body = (data.get("body") or "").strip()
          if body:
              lines.extend(["", "## PR Body", body])

          lines.extend(["", "## Issue Comments"])
          if not issue_comments:
              lines.append("- No issue comments were available.")
          else:
              for comment in issue_comments[-10:]:
                  user = comment.get("user", {}).get("login", "unknown")
                  created_at = comment.get("created_at", "unknown-time")
                  lines.append(f"### {user} at {created_at}")
                  lines.append((comment.get("body") or "").strip() or "(empty comment)")
                  lines.append("")

          lines.append("## Attached Check Status")

          checks = data.get("statusCheckRollup") or []
          if not checks:
              lines.append("- No attached check data was available.")
          else:
              for item in checks:
                  name = item.get("name") or item.get("context") or "unknown"
                  workflow = item.get("workflowName") or ""
                  state = item.get("conclusion") or item.get("state") or item.get("status") or "unknown"
                  details = item.get("detailsUrl") or item.get("targetUrl") or ""
                  label = f"{workflow} / {name}" if workflow else name
                  line = f"- {label}: {state}"
                  if details:
                      line += f" ({details})"
                  lines.append(line)

          with open(output_path, "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

          printf 'head_ref=%s\n' "${head_ref}" >> "${GITHUB_OUTPUT}"
          printf 'base_ref=%s\n' "${base_ref}" >> "${GITHUB_OUTPUT}"

      - name: Run OpenCode review
        id: opencode_review
        env:
          ZAI_CODING_PLAN_API_KEY: ${{ secrets.ZAI_CODING_PLAN_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GIT_AUTHOR_NAME: ${{ steps.git_identity.outputs.author_name }}
          GIT_AUTHOR_EMAIL: ${{ steps.git_identity.outputs.author_email }}
          GIT_COMMITTER_NAME: ${{ steps.git_identity.outputs.author_name }}
          GIT_COMMITTER_EMAIL: ${{ steps.git_identity.outputs.author_email }}
        shell: bash
        run: |
          set -euo pipefail

          prompt="$(cat <<EOF
          \`review\` mode for roadmap work unit \`${{ steps.roadmap.outputs.roadmap_path }}\`.

          Shared execution contract:
          - Treat that roadmap file as the canonical source of scope.
          - Read \`AGENTS.md\`, the roadmap file, the attached review context, and the attached diff before deciding.
          - Apply the \`Runtime: Autonomous GitHub Actions\` policy in \`AGENTS.md\`.
          - Do not modify files, do not create commits, do not push, and do not run \`gh\`.
          - Review \`PR #${{ inputs.pr_number }}\` from \`${{ steps.review_target.outputs.head_ref }}\` into \`${{ steps.review_target.outputs.base_ref }}\`.
          - Use the autonomous review rubric in \`AGENTS.md\`.
          - Respond in this exact plain-text format and nothing else:
            1. First line: \`Decision: approve\` or \`Decision: request-changes\` or \`Decision: comment\`
            2. Second line: blank
            3. Remaining lines: the markdown review body
          - This workflow publishes a PR comment, not a GitHub approval state. Your job is to leave a clear recommendation that a human reviewer can use quickly.
          - Write the review body as if you are leaving a real PR issue comment for the author and for a later fix run, not as an internal audit memo.
          - Always reference the roadmap path and PR number in the review body.
          - Keep the review body concise and structured with these sections:
            1. \`Recommendation\`
            2. \`Why This Is Ready\` when approving, or \`Requested Changes\` when requesting changes, or \`Review Notes\` when commenting
            3. \`Non-Blocking Suggestions\`
            4. \`Validation Context\`
          - The \`Recommendation\` section must start with exactly one of these lines:
            - \`✅ Recommendation: Ready for human approval\`
            - \`❌ Recommendation: Changes recommended before human approval\`
            - \`⚠️ Recommendation: Human decision needed\`
          - If the decision is \`approve\`, explain in 1 to 3 bullets why the PR is ready to merge relative to the roadmap, and explicitly mention whether there are any non-blocking suggestions.
          - If the decision is \`request-changes\`, list only blocking changes. Each bullet must say what should change and why it blocks approval.
          - If the decision is \`comment\`, use \`Review Notes\` for concise guidance that is useful but not approval-blocking.
          - In \`Non-Blocking Suggestions\`, either list concise suggestions or write \`None.\`
          - In \`Validation Context\`, summarize whether attached checks appear green, mixed, failing, or unavailable from the supplied context.
          - Avoid phrases like "in the supplied diff" or "based on the supplied materials." Write like a human reviewer commenting directly on the PR.
          EOF
          )"

          review_output="$(
            opencode run \
            --model "${{ steps.model.outputs.model }}" \
            --agent build \
            -f "${{ steps.roadmap.outputs.roadmap_path }}" \
            -f AGENTS.md \
            -f "${{ steps.artifacts.outputs.review_context_path }}" \
            -f "${{ steps.artifacts.outputs.diff_path }}" \
            -- \
            "${prompt}"
          )"

          printf '%s\n' "${review_output}" > "${RUNNER_TEMP}/opencode-review-output.txt"

          decision_line_number="$(
            printf '%s\n' "${review_output}" \
              | grep -nE '^Decision: (approve|request-changes|comment)$' \
              | head -n 1 \
              | cut -d: -f1
          )"

          if [[ -z "${decision_line_number}" ]]; then
            echo "review output did not contain a valid Decision line" >&2
            printf '%s\n' "${review_output}" >&2
            exit 1
          fi

          decision_line="$(printf '%s\n' "${review_output}" | sed -n "${decision_line_number}p")"
          decision="$(printf '%s\n' "${decision_line}" | sed -E 's/^Decision: (approve|request-changes|comment)$/\1/')"

          case "${decision}" in
            approve|request-changes|comment) ;;
            *)
              echo "review output did not contain a valid Decision line" >&2
              printf '%s\n' "${review_output}" >&2
              exit 1
              ;;
          esac

          printf '%s\n' "${decision}" > "${{ steps.artifacts.outputs.decision_path }}"
          printf '%s\n' "${review_output}" | tail -n +"$((decision_line_number + 2))" > "${{ steps.artifacts.outputs.body_path }}"

          if [[ ! -s "${{ steps.artifacts.outputs.body_path }}" ]]; then
            echo "review body parsed to an empty file" >&2
            exit 1
          fi

      - name: Publish review stage comment
        id: publish_review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="${{ inputs.pr_number }}"
          body_path="${{ steps.artifacts.outputs.body_path }}"
          decision_path="${{ steps.artifacts.outputs.decision_path }}"

          if [[ ! -s "${body_path}" ]]; then
            echo "review body was not written to ${body_path}" >&2
            exit 1
          fi

          if [[ ! -s "${decision_path}" ]]; then
            echo "review decision was not written to ${decision_path}" >&2
            exit 1
          fi

          decision="$(tr '[:upper:]' '[:lower:]' < "${decision_path}" | tr -d '[:space:]')"
          case "${decision}" in
            approve|request-changes|request_changes|requestchanges|comment) ;;
            *)
              echo "unsupported review decision: ${decision}" >&2
              exit 1
              ;;
          esac

          publish_body_path="${RUNNER_TEMP}/opencode-review-publish.md"
          {
            echo "## Autonomous Review"
            echo
            cat "${body_path}"
            echo
            echo
            printf '_Attribution: %s / %s / %s_\n' "${{ steps.attribution.outputs.provider_label }}" "${{ steps.attribution.outputs.product_label }}" "${{ steps.attribution.outputs.model_label }}"
            printf '<!-- workflow-stage: review; run_id: %s; pr: %s; decision: %s -->\n' "${GITHUB_RUN_ID}" "${pr_number}" "${decision}"
            printf '<!-- ai-attribution provider="%s" product="%s" model="%s" -->\n' "${{ steps.attribution.outputs.provider_label }}" "${{ steps.attribution.outputs.product_label }}" "${{ steps.attribution.outputs.model_label }}"
          } > "${publish_body_path}"

          gh pr comment "${pr_number}" --body-file "${publish_body_path}"

          printf 'decision=%s\n' "${decision}" >> "${GITHUB_OUTPUT}"

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## OpenCode Review"
            echo
            echo "- Roadmap path: \`${{ steps.roadmap.outputs.roadmap_path }}\`"
            echo "- Roadmap status: \`${{ steps.roadmap.outputs.roadmap_status }}\`"
            echo "- Review target: \`${{ steps.model.outputs.target_ref }}\`"
            echo "- Resolved model: \`${{ steps.model.outputs.model }}\`"
            echo "- Git commit identity: \`${{ steps.git_identity.outputs.author_name }} <${{ steps.git_identity.outputs.author_email }}>\`"
            echo "- OpenCode review outcome: \`${{ steps.opencode_review.outcome || 'n/a' }}\`"
            echo "- Review publish outcome: \`${{ steps.publish_review.outcome || 'n/a' }}\`"
            echo "- Review decision: \`${{ steps.publish_review.outputs.decision || 'n/a' }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
