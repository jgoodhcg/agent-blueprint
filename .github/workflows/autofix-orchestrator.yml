name: Autofix Orchestrator
run-name: Autofix orchestrator / validation run ${{ github.event.workflow_run.id }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: false
        type: string
      head_branch:
        description: Pull request head branch
        required: false
        type: string
      workflow_conclusion:
        description: Validation workflow conclusion
        required: false
        type: string
  workflow_run:
    workflows:
      - Pull Request Validation
    types:
      - completed

jobs:
  orchestrate:
    name: Evaluate workflow-owned autofix
    runs-on: ubuntu-latest
    concurrency:
      group: autofix-orchestrator-${{ inputs.pr_number || github.event.workflow_run.head_branch || github.event.workflow_run.id }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Resolve autofix target
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          case "${GITHUB_EVENT_NAME}" in
            workflow_run)
              pr_number_input=""
              head_branch="${{ github.event.workflow_run.head_branch }}"
              workflow_conclusion="${{ github.event.workflow_run.conclusion }}"
              ;;
            workflow_dispatch)
              pr_number_input="${{ inputs.pr_number }}"
              head_branch="${{ inputs.head_branch }}"
              workflow_conclusion="${{ inputs.workflow_conclusion }}"
              ;;
            *)
              echo "unsupported event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          max_attempts=2

          if [[ -z "${pr_number_input}" && -z "${head_branch}" ]]; then
            {
              echo "pr_number="
              echo "pr_url="
              echo "roadmap_path="
              echo "fix_count=0"
              echo "next_attempt=1"
              echo "latest_fix_changes_present=unknown"
              echo "should_dispatch=false"
              echo "should_mark_human_needed=false"
              echo "reason=no-head-branch"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ -n "${pr_number_input}" ]]; then
            prs_json="$(
              gh pr view "${pr_number_input}" --json number,body,labels,url,state \
                | python3 - <<'PY'
          import json
          import sys

          pr = json.load(sys.stdin)
          if (pr.get("state") or "").upper() != "OPEN":
              print("[]")
          else:
              pr.pop("state", None)
              print(json.dumps([pr]))
          PY
            )"
          else
            prs_json="$(gh pr list --state open --head "${head_branch}" --json number,body,labels,url)"
          fi

          pr_number="$(
            PRS_JSON="${prs_json}" python3 - <<'PY'
          import json
          import os

          prs = json.loads(os.environ["PRS_JSON"])
          print(prs[0]["number"] if prs else "")
          PY
          )"

          if [[ -z "${pr_number}" ]]; then
            {
              echo "pr_number="
              echo "pr_url="
              echo "roadmap_path="
              echo "fix_count=0"
              echo "next_attempt=1"
              echo "latest_fix_changes_present=unknown"
              echo "should_dispatch=false"
              echo "should_mark_human_needed=false"
              echo "reason=no-open-pr"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          comments_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments?per_page=100")"

          PRS_JSON="${prs_json}" COMMENTS_JSON="${comments_json}" WORKFLOW_CONCLUSION="${workflow_conclusion}" MAX_ATTEMPTS="${max_attempts}" \
            python3 - >> "${GITHUB_OUTPUT}" <<'PY'
          import json
          import os
          import re

          prs = json.loads(os.environ["PRS_JSON"])
          comments = json.loads(os.environ["COMMENTS_JSON"])
          workflow_conclusion = (os.environ["WORKFLOW_CONCLUSION"] or "").lower()
          max_attempts = int(os.environ["MAX_ATTEMPTS"])

          pr = prs[0]
          labels = {label["name"] for label in pr.get("labels") or []}
          body = pr.get("body") or ""
          roadmap_match = re.search(r"^Roadmap:\s*`?([^`\n]+)`?\s*$", body, re.MULTILINE)
          roadmap_path = roadmap_match.group(1).strip() if roadmap_match else ""

          fix_marker_pattern = re.compile(r"<!--\s*workflow-stage:\s*fix\b", re.IGNORECASE)
          changes_pattern = re.compile(r"\bchanges_present:\s*([^ ;>]+)", re.IGNORECASE)

          fix_comments = []
          latest_fix_changes_present = "unknown"

          for comment in comments:
              comment_body = comment.get("body") or ""
              if not fix_marker_pattern.search(comment_body):
                  continue
              fix_comments.append(comment)
              change_match = changes_pattern.search(comment_body)
              if change_match:
                  latest_fix_changes_present = change_match.group(1).strip().lower()

          fix_count = len(fix_comments)
          should_dispatch = False
          should_mark_human_needed = False
          reason = "not-applicable"

          if workflow_conclusion != "failure":
              reason = "validation-not-failing"
          elif "workflow-owned" not in labels or "autofix-enabled" not in labels:
              reason = "autofix-not-enabled"
          elif "autofix-disabled" in labels or "human-needed" in labels:
              reason = "autofix-blocked-by-label"
          elif not roadmap_path:
              reason = "missing-roadmap-path"
          elif latest_fix_changes_present == "false":
              should_mark_human_needed = True
              reason = "latest-fix-made-no-changes"
          elif fix_count >= max_attempts:
              should_mark_human_needed = True
              reason = "fix-attempt-cap-reached"
          else:
              should_dispatch = True
              reason = "dispatch-fix"

          print(f"pr_number={pr['number']}")
          print(f"pr_url={pr.get('url') or ''}")
          print(f"roadmap_path={roadmap_path}")
          print(f"fix_count={fix_count}")
          print(f"next_attempt={fix_count + 1}")
          print(f"latest_fix_changes_present={latest_fix_changes_present}")
          print(f"should_dispatch={'true' if should_dispatch else 'false'}")
          print(f"should_mark_human_needed={'true' if should_mark_human_needed else 'false'}")
          print(f"reason={reason}")
          PY

      - name: Mark PR human-needed
        if: ${{ steps.target.outputs.should_mark_human_needed == 'true' && steps.target.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="${{ steps.target.outputs.pr_number }}"
          comment_path="${RUNNER_TEMP}/autofix-human-needed-comment.md"

          gh label create "human-needed" --color "B60205" --description "Workflow automation stopped and needs a human decision" >/dev/null 2>&1 || true
          gh label create "autofix-disabled" --color "5319E7" --description "Automatic fix dispatch is disabled for this PR" >/dev/null 2>&1 || true
          gh pr edit "${pr_number}" --add-label "human-needed" --add-label "autofix-disabled"

          cat > "${comment_path}" <<EOF
          ## Autofix Orchestrator

          Automatic fix dispatch stopped for PR #${pr_number}.

          - Reason: \`${{ steps.target.outputs.reason }}\`
          - Observed fix attempts: \`${{ steps.target.outputs.fix_count }}\`
          - Latest fix changes_present flag: \`${{ steps.target.outputs.latest_fix_changes_present }}\`

          <!-- workflow-stage: orchestrator; run_id: ${GITHUB_RUN_ID}; pr: ${pr_number}; reason: ${{ steps.target.outputs.reason }} -->
          EOF

          gh pr comment "${pr_number}" --body-file "${comment_path}"

      - name: Dispatch autofix workflow
        if: ${{ steps.target.outputs.should_dispatch == 'true' && steps.target.outputs.pr_number != '' && steps.target.outputs.roadmap_path != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh workflow run opencode-fix.yml \
            -f roadmap_path="${{ steps.target.outputs.roadmap_path }}" \
            -f pr_number="${{ steps.target.outputs.pr_number }}"

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Autofix Orchestrator"
            echo
            echo "- Trigger event: \`${{ github.event_name }}\`"
            echo "- Validation conclusion: \`${{ inputs.workflow_conclusion || github.event.workflow_run.conclusion || 'n/a' }}\`"
            echo "- Head branch: \`${{ inputs.head_branch || github.event.workflow_run.head_branch || 'n/a' }}\`"
            echo "- Target PR: \`#${{ steps.target.outputs.pr_number || 'n/a' }}\`"
            echo "- Roadmap path: \`${{ steps.target.outputs.roadmap_path || 'n/a' }}\`"
            echo "- Fix attempts observed: \`${{ steps.target.outputs.fix_count || '0' }}\`"
            echo "- Next fix attempt: \`${{ steps.target.outputs.next_attempt || 'n/a' }}\`"
            echo "- Latest fix changes_present flag: \`${{ steps.target.outputs.latest_fix_changes_present || 'n/a' }}\`"
            echo "- Dispatch decision: \`${{ steps.target.outputs.should_dispatch || 'false' }}\`"
            echo "- Human-needed decision: \`${{ steps.target.outputs.should_mark_human_needed || 'false' }}\`"
            echo "- Reason: \`${{ steps.target.outputs.reason || 'n/a' }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
